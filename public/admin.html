<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Alcor · Admin</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500&display=swap">
  <link rel="stylesheet" href="/vendor/codemirror/codemirror.css">
  <link rel="stylesheet" href="/styles.css">
  <script src="/themes.js"></script>
</head>
<body>
  <!-- Login -->
  <div id="login" class="center hidden">
    <div class="corner theme-slot"></div>
    <form class="center-card" id="login-form" style="max-width:360px">
      <div class="brand logo-slot">Alcor</div>
      <h1>Panel del evaluador</h1>
      <p>Acceso restringido. Ingresa la contraseña de administrador.</p>
      <label for="pw">Contraseña</label>
      <input id="pw" type="password" autocomplete="current-password" required autofocus>
      <div class="error-text" id="login-err"></div>
      <button class="btn primary lg block">Entrar</button>
    </form>
  </div>

  <!-- App -->
  <div id="dash" class="shell hidden">
    <aside class="side">
      <div class="brand logo-slot">Alcor</div>
      <button class="nav-item on" data-view="cands" id="nav-cands"></button>
      <button class="nav-item" data-view="new" id="nav-new"></button>
      <button class="nav-item" data-view="catalog" id="nav-catalog"></button>
      <div class="side-foot">
        <span class="status" id="stream-status" style="padding:0 6px">Conectando…</span>
        <div class="theme-slot"></div>
        <div style="display:flex;gap:4px">
          <a class="btn ghost sm" href="/api/admin/export" id="btn-export" title="Descargar todos los datos en JSON"></a>
          <button class="btn ghost sm" id="btn-logout"></button>
        </div>
      </div>
    </aside>
    <main class="main">
      <!-- Candidatos -->
      <section id="view-cands" class="view" style="flex-direction:column">
        <div class="bar">
          <h1>Candidatos</h1>
          <div class="seg" id="filter">
            <button class="on" data-f="all">Todos</button><button data-f="ready">Preparados</button><button data-f="live">En curso</button><button data-f="done">Terminados</button>
          </div>
          <div class="spacer"></div>
          <button class="btn sm hidden" id="btn-activate-all"></button>
          <button class="btn primary sm" data-goto="new" id="btn-new-top"></button>
        </div>
        <div class="view">
          <div class="split">
            <div class="list-pane"><div class="list" id="cand-list"></div></div>
            <div class="detail" id="detail"></div>
          </div>
        </div>
      </section>

      <!-- Nuevo candidato -->
      <section id="view-new" class="view hidden" style="flex-direction:column">
        <div class="bar"><h1>Nuevo candidato</h1></div>
        <div class="view"><div class="page"><div class="page-inner" id="new-page"></div></div></div>
      </section>

      <!-- Catálogo -->
      <section id="view-catalog" class="view hidden" style="flex-direction:column">
        <div class="bar"><h1>Catálogo de ejercicios</h1><span class="faint mono" id="cat-count"></span></div>
        <div class="view">
          <div class="split" style="grid-template-columns:minmax(0,420px) minmax(0,1fr)">
            <div class="list-pane"><div class="list" id="cat-list"></div></div>
            <div class="detail" id="cat-detail"></div>
          </div>
        </div>
      </section>
    </main>
  </div>

  <script src="/vendor/codemirror/codemirror.js"></script>
  <script src="/vendor/codemirror/mode/python.js"></script>
  <script src="/vendor/codemirror/mode/javascript.js"></script>
  <script src="/runner.js"></script>
  <script src="/ui.js"></script>
  <script src="/admin.js"></script>
</body>
</html>
