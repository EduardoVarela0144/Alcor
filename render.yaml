services:
  - type: web
    name: alcor
    runtime: node
    plan: free
    buildCommand: echo "sin dependencias"
    startCommand: node server.js
    healthCheckPath: /healthz
    envVars:
      - key: NODE_ENV
        value: production
      - key: ADMIN_PASSWORD
        sync: false
      - key: SESSION_SECRET
        generateValue: true
      - key: RESEND_API_KEY
        sync: false
      - key: MAIL_FROM
        sync: false
      - key: ADMIN_EMAIL
        sync: false
      # Java: URL y token del servicio alcor-runner (abajo)
      - key: RUNNER_URL
        sync: false
      - key: RUNNER_TOKEN
        sync: false
  # Ejecuta el código Java de los candidatos, aislado de las credenciales de Alcor
  - type: web
    name: alcor-runner
    runtime: docker
    plan: free
    dockerfilePath: ./runner/Dockerfile
    dockerContext: ./runner
    healthCheckPath: /healthz
    envVars:
      - key: RUNNER_TOKEN
        sync: false
